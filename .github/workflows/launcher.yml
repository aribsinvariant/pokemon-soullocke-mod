name: Windows launcher
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
          cache-dependency-path: soullink/launcher/requirements-build.txt
      - name: Install launcher build dependencies
        run: python -m pip install -r soullink/launcher/requirements-build.txt
      - name: Test services and launcher controller
        run: python -m unittest discover -s soullink/tests -v
      - name: Build executable and smoke-test packaged GUI
        run: python -m soullink.tools.build_launcher
      - uses: actions/upload-artifact@v4
        with:
          name: SoulLink-Windows-x64
          path: |
            release/launcher/SoulLink-Windows-x64.zip
            release/launcher/smoke-test.json
  publish:
    if: github.event_name == 'release'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SoulLink-Windows-x64
          path: launcher
      - name: Attach launcher to published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq 'SoulLink-Windows-x64.zip'; then
            echo "Launcher already attached; keeping the published artifact."
          else
            gh release upload "$RELEASE_TAG" launcher/SoulLink-Windows-x64.zip --repo "$REPOSITORY"
          fi
